                      <div><p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Aktiv Tapşırıqlar</p><p className="text-2xl font-black text-slate-900 font-mono">1 <span className="text-base text-slate-400">/ 4</span></p></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* TASKS */}
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 xl:p-8 flex flex-col h-full">
                      <div className="flex items-center justify-between mb-8 pb-4 border-b border-slate-100">
                        <h3 className="text-2xl font-extrabold text-slate-900 flex items-center gap-3">
                          <Icon name="ClipboardList" className="text-indigo-600" size={28} /> İcraçı Tapşırıqları (PM)
                        </h3>
                        <span className="bg-indigo-50 text-indigo-700 font-bold px-3 py-1 rounded-lg text-xs uppercase tracking-widest">Workflow</span>
                      </div>
                      <div className="space-y-4 flex-1">
                        {TASKS.map(task => (
                          <div key={task.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-5 border border-slate-100 rounded-2xl bg-slate-50 hover:bg-white hover:border-slate-300 hover:shadow-sm transition-all duration-300 gap-4">
                            <div className="flex gap-4 items-center">
                              {task.status === 'completed' ? <Icon name="CheckCircle" className="text-emerald-500 shrink-0" size={28} /> : 
                               task.status === 'progress' ? <Icon name="CircleDashed" className="text-amber-500 animate-spin-slow shrink-0" size={28} /> : 
                               <Icon name="CircleDashed" className="text-slate-300 shrink-0" size={28} />}
                              <div>
                                <p className="font-bold text-slate-800 text-base">{task.name}</p>
                                <p className="text-sm text-slate-500 font-medium mt-1">Məsul: <span className="text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded">{task.owner}</span></p>
                              </div>
                            </div>
                            <div className="text-left sm:text-right w-full sm:w-auto mt-2 sm:mt-0 pt-3 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                              <span className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest ${
                                task.status === 'completed' ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' :
                                task.status === 'progress' ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-slate-200 text-slate-600 border border-slate-300'
                              }`}>
                                {task.status === 'completed' ? 'Tamamlanıb' : task.status === 'progress' ? 'İcrada' : 'Gözləmədə'}
                              </span>
                              <p className="text-xs text-slate-400 mt-2 font-semibold">{task.date}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* VENDORS */}
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 xl:p-8 flex flex-col h-full">
                      <div className="flex items-center justify-between mb-8 pb-4 border-b border-slate-100">
                        <h3 className="text-2xl font-extrabold text-slate-900 flex items-center gap-3">
                          <Icon name="Truck" className="text-emerald-600" size={28} /> Təchizat: Minimum Bazar
                        </h3>
                        <span className="bg-emerald-50 text-emerald-700 font-bold px-3 py-1 rounded-lg text-xs uppercase tracking-widest">Sədərək/Dərnəgül/Sex</span>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1 content-start overflow-y-auto pr-2 custom-scrollbar max-h-[500px]">
                        {VENDORS.map((v, i) => (
                          <div key={i} className="p-5 border border-slate-100 rounded-2xl bg-white shadow-sm hover:border-emerald-300 hover:shadow-md transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                            <div className="absolute -right-6 -top-6 bg-emerald-50 w-16 h-16 rounded-full opacity-50"></div>
                            <div>
                              <p className="text-sm font-bold text-slate-600 mb-1.5 leading-snug">{v.name}</p>
                              <div className="flex items-end gap-2">
                                <p className="text-2xl font-black font-mono text-emerald-600">{v.price}</p>
                                <p className="text-sm text-slate-400 font-sans font-medium mb-1">/ {v.unit}</p>
                              </div>
                            </div>
                            <div className="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between">
                              <span className="text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-600 border border-emerald-100">
                                Topdan MİNİMUM
                              </span>
                              <span className="text-xs font-bold text-slate-400 line-through decoration-red-400/50">
                                {v.oldPrice}
                              </span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
