<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Xərc Qeydiyyat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Xərc Qeydiyyat</h1>
    <form id="costForm">
      <label>
        Ad:
        <input type="text" name="name" required>
        <span class="warning"></span>
      </label>
      <label>
        Vahid:
        <input type="text" name="unit" required>
        <span class="warning"></span>
      </label>
      <label>
        Miqdar:
        <input type="number" name="qty" step="any" required>
        <span class="warning"></span>
      </label>
      <label>
        Vahid Qiymət:
        <input type="number" name="unitPrice" step="any" required>
        <span class="warning"></span>
      </label>
      <label>
        Cəmi:
        <div class="total-group">
          <input type="number" name="total" step="any" readonly>
          <button type="button" id="toggleTotal">🔒</button>
        </div>
        <span class="warning"></span>
      </label>
      <label>
        Endirim (%):
        <input type="number" name="discount" step="any" value="0">
        <span class="warning"></span>
      </label>
      <label>
        Ödəniləcək:
        <input type="number" name="payable" step="any" readonly>
        <span class="warning"></span>
      </label>
      <label>
        Qəbz (8 MB‑a qədər):
        <input type="file" name="receipt" accept="image/*">
        <span class="warning"></span>
      </label>
      <label>
        Qeyd:
        <textarea name="notes"></textarea>
      </label>
      <label>
        Versiya:
        <input type="text" name="version" required>
        <span class="warning"></span>
      </label>
      <button type="submit">Göndər</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
