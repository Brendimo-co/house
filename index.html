function DashboardView() {
  const [taskFilter, setTaskFilter] = useState('all');
  const [matSearch, setMatSearch] = useState('');
  const [matTab, setMatTab] = useState('materials');

  const phases = [...new Set(ALL_TASKS.map(t=>t.phase))];
  const filteredTasks = ALL_TASKS.filter(t => taskFilter==='all' || t.phase===taskFilter || t.priority===taskFilter);

  const prioColors = {critical:'bg-red-900/60 text-red-300 border-red-700/40',high:'bg-amber-900/60 text-amber-300 border-amber-700/40',medium:'bg-blue-900/60 text-blue-300 border-blue-700/40'};
  const prioLabels = {critical:'KRİTİK',high:'YÜKSƏK',medium:'ORTA'};

  const filteredMats = MATERIALS_DATA.map(cat=>({
    ...cat, items: cat.items.filter(i=>i.name.toLowerCase().includes(matSearch.toLowerCase()))
  })).filter(cat=>cat.items.length>0);

  const filteredLabor = LABOR_DATA.map(cat=>({
    ...cat, items: cat.items.filter(i=>i.name.toLowerCase().includes(matSearch.toLowerCase()))
  })).filter(cat=>cat.items.length>0);

  const totalTasksByPhase = phases.map(p=>({phase:p, count:ALL_TASKS.filter(t=>t.phase===p).length}));

  return (
    <div className="max-w-7xl mx-auto space-y-6 fadeup">
      {/* Summary cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          {label:'Xalis Tikinti', val:fmt(TOTAL_CONSTRUCTION), icon:'TrendingUp', color:'text-blue-400', bg:'bg-blue-900/30 border-blue-800/40'},
          {label:'Mebel+Texnika', val:fmt(TOTAL_FURNITURE), icon:'Package', color:'text-purple-400', bg:'bg-purple-900/30 border-purple-800/40'},
          {label:'MİNİMUM YEKUN', val:fmt(GRAND_TOTAL), icon:'Wallet', color:'text-emerald-400', bg:'bg-emerald-900/30 border-emerald-800/40'},
          {label:'Cəmi PM Tapşırığı', val:`${ALL_TASKS.length} tapşırıq`, icon:'ClipboardList', color:'text-amber-400', bg:'bg-amber-900/30 border-amber-800/40'},
        ].map((c,i)=>(
          <div key={i} className={`bg-slate-900 border ${c.bg} rounded-2xl p-5 flex items-center gap-4`}>
            <div className={`${c.color} opacity-80`}><Icon name={c.icon} size={28}/></div>
            <div>
              <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-0.5">{c.label}</p>
              <p className={`mono text-lg font-black ${c.color}`}>{c.val}</p>
            </div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        {/* TASKS */}
        <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col" style={{maxHeight:'820px'}}>
          <div className="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
            <h3 className="font-bold text-white flex items-center gap-2.5">
              <Icon name="ClipboardList" className="text-indigo-400" size={22}/> Layihə Meneceri Tapşırıqları
            </h3>
            <span className="mono text-xs text-indigo-400 bg-indigo-950/60 px-2.5 py-1 rounded-lg border border-indigo-800/40">{ALL_TASKS.length} tapşırıq</span>
          </div>
          <div className="px-4 py-3 border-b border-slate-800 flex gap-2 overflow-x-auto scrollbar">
            <button onClick={()=>setTaskFilter('all')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${taskFilter==='all'?'bg-slate-700 text-white':'text-slate-500 hover:text-slate-300'}`}>Hamısı ({ALL_TASKS.length})</button>
            {phases.map(p=>(
              <button key={p} onClick={()=>setTaskFilter(p)} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${taskFilter===p?'bg-slate-700 text-white':'text-slate-500 hover:text-slate-300'}`}>
                {p.split('(')[0].trim()}
              </button>
            ))}
            <button onClick={()=>setTaskFilter('critical')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${taskFilter==='critical'?'bg-red-900/60 text-red-300 border border-red-700/40':'text-slate-500 hover:text-red-400'}`}>Kritik</button>
          </div>
          <div className="overflow-y-auto scrollbar flex-1">
            {filteredTasks.map(task=>(
              <div key={task.id} className="px-4 py-3.5 border-b border-slate-800/60 hover:bg-slate-800/30 transition-colors">
                <div className="flex items-start gap-3">
                  <div className="mono text-xs text-slate-600 mt-0.5 shrink-0 w-6 text-right">{task.id}</div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-slate-200 leading-tight mb-1.5">{task.name}</p>
                    <div className="flex flex-wrap gap-2 items-center">
                      <span className={`text-[9px] font-black uppercase tracking-widest px-2 py-0.5 rounded-md border ${prioColors[task.priority]}`}>{prioLabels[task.priority]}</span>
                      <span className="text-[10px] text-slate-500 font-medium">Həftə: <span className="text-slate-400">{task.week}</span></span>
                      <span className="text-[10px] text-slate-500 font-medium">Məsul: <span className="text-slate-300">{task.owner}</span></span>
                    </div>
                    {task.notes && <p className="text-[10px] text-amber-500/70 mt-1 italic">{task.notes}</p>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* SUPPLY PRICES */}
        <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col" style={{maxHeight:'820px'}}>
          <div className="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
            <h3 className="font-bold text-white flex items-center gap-2.5">
              <Icon name="Truck" className="text-emerald-400" size={22}/> Bazar Qiymətləri (Novxanı)
            </h3>
            <span className="text-[10px] text-emerald-400 bg-emerald-950/60 px-2.5 py-1 rounded-lg border border-emerald-800/40 font-bold">MİNİMUM QİYMƏTLƏR</span>
          </div>
          <div className="px-4 pt-3 border-b border-slate-800 pb-3 space-y-2">
            <input value={matSearch} onChange={e=>setMatSearch(e.target.value)} placeholder="Material axtarın..." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 outline-none focus:border-slate-500"/>
            <div className="flex gap-2">
              <button onClick={()=>setMatTab('materials')} className={`flex-1 py-2 rounded-xl text-xs font-bold ${matTab==='materials'?'bg-emerald-900/60 text-emerald-300 border border-emerald-700/40':'text-slate-500 bg-slate-800/50'}`}>Material Qiymətləri</button>
              <button onClick={()=>setMatTab('labor')} className={`flex-1 py-2 rounded-xl text-xs font-bold ${matTab==='labor'?'bg-amber-900/60 text-amber-300 border border-amber-700/40':'text-slate-500 bg-slate-800/50'}`}>Usta/İş Qiymətləri</button>
            </div>
          </div>
          <div className="overflow-y-auto scrollbar flex-1 p-3 space-y-4">
            {(matTab==='materials' ? filteredMats : filteredLabor).map((cat,ci)=>(
              <div key={ci}>
                <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 px-1">{cat.cat}</p>
                <div className="space-y-1.5">
                  {cat.items.map((item,ii)=>{
                    const saving = ((item.regPrice-item.minPrice)/item.regPrice*100).toFixed(0);
                    return (
                      <div key={ii} className="bg-slate-800/50 border border-slate-700/40 rounded-xl px-4 py-3 flex items-center justify-between gap-3 hover:border-slate-600/60 transition-colors">
                        <div className="flex-1 min-w-0">
                          <p className="text-xs font-semibold text-slate-200 truncate">{item.name}</p>
                          {item.source && <p className="text-[10px] text-slate-500 truncate mt-0.5">{item.source}</p>}
                        </div>
                        <div className="flex items-center gap-2.5 shrink-0">
                          <div className="text-right">
                            <div className="mono text-xs text-slate-500 line-through">{item.regPrice.toFixed(2)}</div>
                            <div className="mono font-black text-emerald-400 text-sm">{item.minPrice.toFixed(2)} ₼</div>
                            <div className="text-[10px] text-slate-400">{item.unit}</div>
                          </div>
                          <span className="bg-emerald-950/80 text-emerald-400 border border-emerald-800/40 text-[10px] font-black px-2 py-0.5 rounded-lg mono">-{saving}%</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

            ))}
          </div>
          <div className="flex items-center gap-3 px-4 border-l border-slate-800 shrink-0">
            <div className="text-right">
              <p className="text-[9px] font-bold text-emerald-500 uppercase tracking-widest">Minimum Büdcə</p>
              <p className="mono text-xl font-black text-white">{fmt(GRAND_TOTAL)}</p>
            </div>
          </div>
        </div>
      </div>

      {view==='passport' && <PassportView/>}
      {view==='house' && <HouseView/>}
      {view==='dashboard' && <DashboardView/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
