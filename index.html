<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Xərc Yönetimi — Material/Xidmət</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Xərc İdarəetməsi</h1>
      <p class="sub">Sadə, sürətli forma — bütün məlumatlar Google Sheets-ə yazılır.</p>
    </header>

    <form id="costForm" novalidate>
      <div class="grid">
        <label class="field">
          <span>Material / Xidmət adı</span>
          <input type="text" id="name" placeholder="məs: Beton M300 / Daşınma xidməti" required />
        </label>

        <label class="field">
          <span>Ölçü vahidi</span>
          <input type="text" id="unit" placeholder="m³, ədəd, saat..." required />
        </label>

        <label class="field">
          <span>Miqdar</span>
          <input type="number" id="qty" min="0" step="0.01" placeholder="0.00" required />
        </label>

        <label class="field">
          <span>Vahid qiymət (AZN)</span>
          <input type="number" id="unitPrice" min="0" step="0.01" placeholder="0.00" required />
        </label>

        <label class="field">
          <span>Cəm qiymət (AZN)</span>
          <input type="text" id="total" readonly />
        </label>

        <label class="field">
          <span>Endirim % (opsional)</span>
          <input type="number" id="discountPct" min="0" max="100" step="0.01" placeholder="0" />
        </label>

        <label class="field">
          <span>Endirimli qiymət (AZN)</span>
          <input type="text" id="discounted" readonly />
        </label>

        <label class="field">
          <span>Çekin şəkli (JPG/PNG)</span>
          <input type="file" id="receipt" accept="image/*" />
        </label>

        <label class="field">
          <span>Qeydlər (opsional)</span>
          <input type="text" id="notes" placeholder="məs: PO#123, satıcı adı və s." />
        </label>
      </div>

      <div class="actions">
        <button type="submit" id="submitBtn">Yadda saxla</button>
        <button type="button" id="resetBtn" class="ghost">Təmizlə</button>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
